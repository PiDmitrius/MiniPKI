name: Build & Test

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

jobs:
  build:
    name: Cross-build (6 platforms)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build libraries and tests
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src/build \
            pidmitrius/minipki-zig-build:latest \
            make -j$(nproc) lib test

      - name: List artifacts
        run: |
          find build/out -type f \( -name "test_minipki*" -o -name "libminipki.*" \
            -o -name "minipki.dll" \) ! -name "*.o" | sort | \
            xargs ls -lh

      - name: Upload linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-linux-amd64
          path: |
            build/out/linux-amd64/test_minipki
            build/out/linux-amd64/libminipki.so

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-linux-arm64
          path: |
            build/out/linux-arm64/test_minipki
            build/out/linux-arm64/libminipki.so

      - name: Upload macos-amd64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-macos-amd64
          path: |
            build/out/macos-amd64/test_minipki
            build/out/macos-amd64/libminipki.dylib

      - name: Upload macos-arm64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-macos-arm64
          path: |
            build/out/macos-arm64/test_minipki
            build/out/macos-arm64/libminipki.dylib

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-windows-amd64
          path: |
            build/out/windows-amd64/test_minipki.exe
            build/out/windows-amd64/minipki.dll

      - name: Upload windows-arm64
        uses: actions/upload-artifact@v4
        with:
          name: minipki-windows-arm64
          path: |
            build/out/windows-arm64/test_minipki.exe
            build/out/windows-arm64/minipki.dll

  test-linux-amd64:
    name: Test linux-amd64
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minipki-linux-amd64
      - name: Run tests
        run: |
          chmod +x test_minipki
          echo "=== Dynamic ==="
          LD_LIBRARY_PATH=. ./test_minipki

  test-linux-arm64:
    name: Test linux-arm64
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minipki-linux-arm64
      - name: Run tests
        run: |
          chmod +x test_minipki
          echo "=== Dynamic ==="
          LD_LIBRARY_PATH=. ./test_minipki

  test-macos-amd64:
    name: Test macos-amd64
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minipki-macos-amd64
      - name: Run tests
        run: |
          chmod +x test_minipki
          codesign -s - --force test_minipki libminipki.dylib
          echo "=== Dynamic ==="
          ./test_minipki

  test-macos-arm64:
    name: Test macos-arm64
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minipki-macos-arm64
      - name: Run tests
        run: |
          chmod +x test_minipki
          codesign -s - --force test_minipki libminipki.dylib
          echo "=== Dynamic ==="
          ./test_minipki

  test-windows-amd64:
    name: Test windows-amd64
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minipki-windows-amd64
      - name: Run tests
        shell: cmd
        run: |
          echo === Dynamic ===
          test_minipki.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test-linux-amd64
      - test-linux-arm64
      - test-macos-amd64
      - test-macos-arm64
      - test-windows-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in minipki-*; do
            tar czf "${d}.tar.gz" "$d"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
